<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#013C4C">
<title>Cadence Cycle Count</title>
<style>
  :root {
    --navy: #013C4C;
    --accent-ink: #013C4C;
    --navy-light: #0A5468;
    --lime: #BDD132;
    --lime-dark: #96A626;
    --ink: #16232A;
    --soft: #57666A;
    --line: #D9E1E3;
    --bg: #F4F6F6;
    --card: #FFFFFF;
    --ok: #2E8B4F;
    --ok-bg: #E7F4EA;
    --warn: #B8860B;
    --warn-bg: #FBF3DC;
    --bad: #B3261E;
    --bad-bg: #FCE8E6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1618;
      --card: #172326;
      --ink: #EAF0F1;
      --soft: #9FB0B4;
      --line: #2A3A3E;
      --navy-light: #0F6580;
      --ok-bg: #16301F;
      --warn-bg: #322A10;
      --bad-bg: #331714;
      --accent-ink: #8FD3E8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1618;
    --card: #172326;
    --ink: #EAF0F1;
    --soft: #9FB0B4;
    --line: #2A3A3E;
    --navy-light: #0F6580;
    --ok-bg: #16301F;
    --warn-bg: #322A10;
    --bad-bg: #331714;
    --accent-ink: #8FD3E8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding-bottom: 32px; }
  button { font-family: inherit; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); }

  header.topbar {
    background: var(--navy); color: #fff; padding: 14px 16px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    position: sticky; top: 0; z-index: 20;
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
  }
  header.topbar .brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  header.topbar .brand .eyebrow {
    font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--lime); font-weight: bold;
  }
  header.topbar .brand .title { font-size: 16px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.topbar .backbtn {
    background: none; border: none; color: #fff; font-size: 20px; padding: 4px 8px; margin: -4px 0 -4px -8px; cursor: pointer; line-height: 1;
  }
  .topbar-link {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff;
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: bold; cursor: pointer;
  }
  .progress-pill {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: bold; white-space: nowrap;
    color: var(--lime);
  }

  main { padding: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }
  .muted { color: var(--soft); }
  h2.section {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--soft);
    margin: 18px 2px 8px; font-weight: bold;
  }

  /* Session list */
  .session-card {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    margin-bottom: 10px; cursor: pointer;
  }
  .session-card:active { background: var(--bg); }
  .session-card .info { min-width: 0; }
  .session-card .label { font-weight: bold; font-size: 15px; }
  .session-card .sub { font-size: 12.5px; color: var(--soft); margin-top: 2px; }
  .session-card .chev { color: var(--soft); font-size: 20px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--soft); }
  .empty-state .big { font-size: 32px; margin-bottom: 8px; }

  /* Buttons */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 10px; padding: 14px 16px; font-size: 15px; font-weight: bold;
    border: none; cursor: pointer; width: 100%;
  }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:active { background: var(--navy-light); }
  .btn-lime { background: var(--lime); color: var(--ink); }
  .btn-lime:active { background: var(--lime-dark); }
  .btn-outline { background: transparent; color: var(--accent-ink); border: 1.5px solid var(--accent-ink); }
  .btn-outline:active { background: var(--bg); }
  .btn-ghost { background: transparent; color: var(--soft); font-weight: normal; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .btn:disabled { opacity: .45; cursor: default; }

  /* Scan view */
  #reader-live { width: 100%; min-height: 260px; border-radius: 12px; overflow: hidden; background: #000; }
  #reader-live video { object-fit: cover; }
  #reader-file { display: none; }
  .scan-frame-hint {
    text-align: center; color: var(--soft); font-size: 13px; margin-top: 10px; line-height: 1.5;
  }
  .scan-toggle-wrap { margin-bottom: 12px; }

  /* Search */
  .search-box {
    width: 100%; padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    font-size: 16px; background: var(--card); color: var(--ink); margin-bottom: 10px;
  }
  .search-box:focus { outline: none; border-color: var(--navy); }
  .item-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    margin-bottom: 8px; cursor: pointer;
  }
  .item-row:active { background: var(--bg); }
  .item-row .name { font-weight: bold; font-size: 14.5px; }
  .item-row .meta { font-size: 12px; color: var(--soft); margin-top: 2px; }
  .item-row .book-badge {
    font-size: 12px; color: var(--soft); white-space: nowrap; text-align: right;
  }

  /* Quantity entry */
  .qty-card { text-align: center; }
  .qty-card .pname { font-size: 17px; font-weight: bold; line-height: 1.3; }
  .qty-card .pmeta { font-size: 13px; color: var(--soft); margin-top: 4px; }
  .qty-stepper {
    display: flex; align-items: center; justify-content: center; gap: 14px; margin: 20px 0 6px;
  }
  .qty-stepper button {
    width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--line);
    background: var(--card); font-size: 24px; color: var(--navy); cursor: pointer; font-weight: bold;
  }
  .qty-stepper button:active { background: var(--bg); }
  .qty-stepper input {
    width: 110px; text-align: center; font-size: 30px; font-weight: bold; border: none;
    background: transparent; color: var(--ink); font-family: inherit;
  }
  .qty-stepper input:focus { outline: none; }
  .book-ref { text-align: center; font-size: 13px; color: var(--soft); margin-bottom: 18px; }

  /* Progress list */
  .flag { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .flag-ok { background: var(--ok); }
  .flag-warn { background: var(--warn); }
  .flag-bad { background: var(--bad); }
  .flag-pending { background: var(--line); }
  .prog-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }
  .prog-row:last-child { border-bottom: none; }
  .prog-row .name { font-size: 13.5px; flex: 1; min-width: 0; }
  .prog-row .name .sub { display: block; font-size: 11px; color: var(--soft); }
  .prog-row .counts { font-size: 13px; font-weight: bold; text-align: right; white-space: nowrap; }
  .prog-row .counts .book { font-weight: normal; color: var(--soft); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px;
    font-size: 13.5px; font-weight: bold; z-index: 100; box-shadow: 0 4px 14px rgba(0,0,0,.3);
    max-width: 90%; text-align: center;
  }
  .banner {
    border-radius: 10px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 12px; line-height: 1.5;
  }
  .banner-warn { background: var(--warn-bg); color: var(--warn); }
  .banner-bad { background: var(--bad-bg); color: var(--bad); }
  .banner-ok { background: var(--ok-bg); color: var(--ok); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    flex: 1; text-align: center; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: bold;
    border: 1.5px solid var(--line); color: var(--soft); cursor: pointer; background: var(--card);
  }
  .tab.active { border-color: var(--navy); color: var(--navy); background: var(--card); }
  :root[data-theme="dark"] .tab.active, .tab.active { }
  .stat-row { display: flex; gap: 10px; margin-bottom: 4px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: center; }
  .stat .num { font-size: 19px; font-weight: bold; }
  .stat .lbl { font-size: 10.5px; color: var(--soft); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
  a.link { color: var(--accent-ink); }
  .spinner {
    display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand" id="topbarBrand">
      <span class="eyebrow">Cadence Petroleum · Site 5102</span>
      <span class="title" id="topbarTitle">Cycle Count</span>
    </div>
    <div id="topbarRight"></div>
  </header>
  <main id="main"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
(function () {
  "use strict";

  var state = {
    sessions: [],
    sessionsLoaded: false,
    currentSessionId: null,
    currentSession: null,   // {label, businessDate, range, items[]}
    counts: {},              // idx -> count doc data
    view: "loading",         // loading | sessions | import | scan | manual | qty | progress
    scanning: false,
    scanner: null,
    pendingItem: null,       // {idx, item, barcode|null, isNew}
    searchTerm: "",
  };

  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtNum(n) {
    if (n == null) return "";
    var r = Math.round(n * 100) / 100;
    return (r % 1 === 0) ? String(r) : r.toFixed(2).replace(/0$/, "").replace(/\.$/, "");
  }
  function toast(msg, ms) {
    var t = document.querySelector(".toast");
    if (t) t.remove();
    t = el('<div class="toast">' + escapeHtml(msg) + "</div>");
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, ms || 2200);
  }

  function setTopbar(title, showBack, rightHtml) {
    document.getElementById("topbarTitle").textContent = title;
    document.getElementById("topbarRight").innerHTML = rightHtml || "";
    var brand = document.getElementById("topbarBrand");
    var existingBack = document.getElementById("backBtn");
    if (existingBack) existingBack.remove();
    if (showBack) {
      var b = el('<button class="backbtn" id="backBtn">&#8592;</button>');
      b.addEventListener("click", showBack);
      document.querySelector("header.topbar").insertBefore(b, brand);
    }
  }

  // ---------- data layer ----------
  // Everything lives in this browser's localStorage — no server, no
  // window.claude capability. Data doesn't sync across devices; export
  // to CSV to get counts off the phone.

  var LS_KEY = "cadenceCycleCount.v1";

  function loadLocalStore() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { sessions: {}, barcodes: {} };
  }
  function saveLocalStore() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); } catch (e) {}
  }
  var LOCAL = loadLocalStore();

  // ----- barcode cleanup -----
  // The same box can come back as different strings (UPC-A read as 12 digits
  // one time and as 13-digit EAN the next, or a partial read of a carton's
  // ITF-14). Every read is validated and converted to one standard 14-digit
  // form so a barcode learned once is always found again.

  function gtinValid(d) {
    var sum = 0, n = d.length;
    for (var i = 0; i < n - 1; i++) {
      var digit = +d.charAt(n - 2 - i);
      sum += (i % 2 === 0) ? digit * 3 : digit;
    }
    return (10 - (sum % 10)) % 10 === +d.charAt(n - 1);
  }

  function expandUpcE(d) {
    // 8-digit UPC-E -> 12-digit UPC-A
    var ns = d.charAt(0), m = d.substr(1, 6), c = d.charAt(7), last = m.charAt(5), core;
    if (last <= "2") core = m.substr(0, 2) + last + "0000" + m.substr(2, 3);
    else if (last === "3") core = m.substr(0, 3) + "00000" + m.substr(3, 2);
    else if (last === "4") core = m.substr(0, 4) + "00000" + m.charAt(4);
    else core = m.substr(0, 5) + "0000" + last;
    return ns + core + c;
  }

  // Returns the standardized code, or null if this read looks bad.
  function cleanBarcode(text, formatName) {
    var t = String(text == null ? "" : text).trim();
    if (!t) return null;
    var fmt = String(formatName || "").toUpperCase();
    if (/^\d+$/.test(t)) {
      var n = t.length;
      if (n === 8 && !gtinValid(t) && /^[01]/.test(t)) {
        var upca = expandUpcE(t);
        if (gtinValid(upca)) t = upca, n = 12;
      }
      if (n === 8 || n === 12 || n === 13 || n === 14) {
        if (!gtinValid(t)) return null;
        while (t.length < 14) t = "0" + t;
        return t;
      }
      // Retail/case barcodes are never these lengths; a short ITF/UPC/EAN read is a partial read.
      if (/ITF|UPC|EAN/.test(fmt)) return null;
      return t;
    }
    return t.toUpperCase();
  }

  function prettyBarcode(code) {
    // Show the familiar 12-digit UPC when that's what it is.
    return /^00\d{12}$/.test(code) ? code.substr(2) : code;
  }

  // Bring barcodes learned by earlier versions into the standard form.
  (function migrateBarcodes() {
    var fixed = {}, changed = false;
    Object.keys(LOCAL.barcodes || {}).forEach(function (k) {
      var nk = cleanBarcode(k, "") || k;
      if (nk !== k) changed = true;
      fixed[nk] = LOCAL.barcodes[k];
    });
    LOCAL.barcodes = fixed;
    if (changed) saveLocalStore();
  })();

  // ----- shared barcode database -----
  // One barcode file (barcodes.json) lives in the GitHub repo on its own
  // branch, so updates don't rebuild the website. Every phone reads it on
  // open; a phone with a sync key writes new matches back to it. Matches made
  // without a key (or while offline) wait on the phone and go up on the next
  // sync. Priority when codes disagree: this phone's unsynced match, then the
  // shared file, then the starter list below.
  var DB = { owner: "CpCadenceP", repo: "cadence-scanner", branch: "barcode-db", path: "barcodes.json" };
  var GH_API = "https://api.github.com/repos/" + DB.owner + "/" + DB.repo;

  // Starter list: carton codes confirmed on real cases, plus public UPCs found
  // by part number (see Cadence Barcode Database.xlsx). [product, package, note]
  var BUILT_IN_BARCODES = {
    "00074130955066": ["VAL ADV FULL SYN 5W30 6/32", "Case Gallons", "VV955 carton"],
    "00074130927063": ["VAL ADV FULL SYN 5W20 6/32", "Case Gallons", "VV927 carton"],
    "00074130975125": ["VAL SYNPOW FS 75W90 GO 12/1 QT", "Case Gallons", "VV975 carton"],
    "00074130009554": ["VAL ADV FULL SYN 5W30 6/32", "Case Gallons", "VV955 bottle"],
    "00074130009271": ["VAL ADV FULL SYN 5W20 6/32", "Case Gallons", "VV927 bottle"],
    "00074130001770": ["VAL PC DAILY PROTECT 5W30 6/1", "Case Gallons", "797975 bottle"],
    "00074130029835": ["VAL ADV FULL SYN 0W16 6/32", "Case Gallons", "878400 bottle"],
    "00074130701335": ["VAL CERULEAN #2 GRS 50/14.1", "Case Pound", "VV70133 tube"],
    "00074130046443": ["VAL Dual Clutch Syn Trans 6/32", "Case Gallons", "888705 bottle"],
    "00074130003248": ["VAL MAXLIFE MV DEX/MER ATF 6/1", "Case Gallons", "VV3246 bottle"],
    "00074130705180": ["VAL PB EXTREME SYN 5W40 3/1", "Case Gallons", "774038 bottle"],
    "00074130047976": ["VAL PB ONE SOL GEN2 15W40 3/1", "Case Gallons", "891007 bottle"],
    "00074130001749": ["VAL PC DAILY PROTECT 5W20 6/1", "Case Gallons", "797974 bottle"],
    "00074130056466": ["VAL ALLTERRAIN 15W40 3/1 GA", "Case Gallons", "894015 bottle"],
    "00074130022003": ["VAL COBALT #2 GRS 50/14.1 OC", "Case Pound", "872117 tube"],
    "00074130031180": ["VAL EURO SYN 5W30 ABB 1/5 GA", "Case Gallons", "881055 box"],
    "00074130033535": ["VAL FULL SYN 5W20 BB", "Case Gallons", "881655 box"],
    "00074130031104": ["VAL MAXLIFE MV DEX/MER ATF BB", "Case Gallons", "881051 box"],
    "00074130001299": ["VAL PC DAILY PROTECT 10W30 6/1", "Case Gallons", "797578 bottle"],
    "00074130009752": ["VAL SYNPOW FS 75W90 GO 12/1 QT", "Case Gallons", "VV975 bottle"],
    "00074130003538": ["VAL ATF DEX/MERC 6/1 QT", "Case Gallons", "798153 bottle"],
    "00074130701243": ["VAL CRIMSON #2 GRS 50/14.1 OC", "Case Pound", "VV70124 tube"],
    "00074130031081": ["VAL EURO SYN 5W40 ABB 1/5 GA", "Case Gallons", "881050 box"],
    "00074130031029": ["VAL MaxLife HM 5W30 BB", "Case Gallons", "881047 box"],
    "00074130001350": ["VAL PC DAILY PROTECT 20W50 6/1", "Case Gallons", "822344 bottle"],
    "00074130030961": ["VAL SAE 5W30 ABB 1/5 GA", "Case Gallons", "881042 box"],
    "00074130754331": ["Valvoline CVT Fluid 6/1 QT", "Case Gallons", "804751 bottle"]
  };

  if (!LOCAL.remoteCache) LOCAL.remoteCache = {};
  if (!LOCAL.pending) {
    // First run of the shared version: anything this phone matched by hand
    // gets queued so it goes up to the shared file.
    LOCAL.pending = {};
    Object.keys(LOCAL.barcodes || {}).forEach(function (k) {
      var b = LOCAL.barcodes[k];
      if (b && b.learnedInSession !== "built-in") {
        LOCAL.pending[k] = { product: b.product, packageDesc: b.packageDesc, addedBy: "scan", addedAt: b.learnedAt || new Date().toISOString() };
      }
    });
  }

  function rebuildBarcodes() {
    var out = {};
    Object.keys(BUILT_IN_BARCODES).forEach(function (k) {
      var b = BUILT_IN_BARCODES[k];
      out[k] = { product: b[0], packageDesc: b[1], addedBy: "starter", note: b[2] };
    });
    Object.keys(LOCAL.remoteCache).forEach(function (k) {
      var nk = cleanBarcode(k, "");
      if (nk) out[nk] = LOCAL.remoteCache[k];
    });
    Object.keys(LOCAL.pending).forEach(function (k) { if (cleanBarcode(k, "")) out[k] = LOCAL.pending[k]; });
    LOCAL.barcodes = out;
  }
  rebuildBarcodes();
  saveLocalStore();

  var SYNC_KEY_LS = "cadenceSyncKey";
  function getSyncKey() { try { return localStorage.getItem(SYNC_KEY_LS) || ""; } catch (e) { return ""; } }
  function setSyncKey(k) {
    try { if (k) localStorage.setItem(SYNC_KEY_LS, k); else localStorage.removeItem(SYNC_KEY_LS); } catch (e) {}
  }

  function b64ToText(b64) {
    var bin = atob(String(b64).replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function textToB64(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function gh(method, url, body, useKey) {
    var headers = { "Accept": "application/vnd.github+json" };
    var key = getSyncKey();
    if (useKey !== false && key) headers["Authorization"] = "Bearer " + key;
    if (body) headers["Content-Type"] = "application/json";
    return fetch(GH_API + url, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  }

  function syncErr(status, msg) { var e = new Error(msg); e.status = status; return e; }

  // Read the shared file. Returns {sha, data}; data is null if it doesn't exist yet.
  function fetchShared(useKey) {
    return gh("GET", "/contents/" + DB.path + "?ref=" + DB.branch, null, useKey).then(function (r) {
      if (r.status === 404) return { sha: null, data: null };
      if (r.status === 401 && useKey !== false) {
        state.syncKeyBad = true;
        return fetchShared(false); // public repo: still readable without a key
      }
      if (!r.ok) throw syncErr(r.status, "read failed");
      return r.json().then(function (j) { return { sha: j.sha, data: JSON.parse(b64ToText(j.content)) }; });
    });
  }

  function ensureBranch() {
    return gh("GET", "/git/ref/heads/" + DB.branch).then(function (r) {
      if (r.ok) return;
      if (r.status !== 404) throw syncErr(r.status, "branch check failed");
      return gh("GET", "/git/ref/heads/main").then(function (m) {
        if (!m.ok) throw syncErr(m.status, "main branch not found");
        return m.json();
      }).then(function (main) {
        return gh("POST", "/git/refs", { ref: "refs/heads/" + DB.branch, sha: main.object.sha });
      }).then(function (c) {
        if (!c.ok && c.status !== 422) throw syncErr(c.status, "couldn't create branch");
      });
    });
  }

  function sortedObj(o) {
    var out = {};
    Object.keys(o).sort().forEach(function (k) { out[k] = o[k]; });
    return out;
  }

  var syncRunning = null, syncQueued = false, syncTimer = null, lastPullAt = 0;

  function scheduleSync(ms) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncBarcodes, ms == null ? 2500 : ms);
  }

  function syncBarcodes() {
    if (syncRunning) { syncQueued = true; return syncRunning; }
    state.syncStatus = "syncing";
    updateSyncLine();
    syncRunning = attemptSync(0).then(function (msg) {
      state.syncStatus = "ok";
      state.syncError = msg || null;
      LOCAL.lastSync = new Date().toISOString();
      lastPullAt = Date.now();
    }).catch(function (e) {
      state.syncStatus = "error";
      var s = e && e.status;
      if (s === 401) state.syncError = "The sync key was rejected. Check it on the Barcodes screen.";
      else if (s === 403 || s === 404) state.syncError = "The sync key can't write to cadence-scanner. Check its repository access and Contents permission.";
      else if (s === 429) state.syncError = "GitHub is busy. Will try again shortly.";
      else state.syncError = "Couldn't reach the shared database (no signal?). New matches are saved on this phone and will sync later.";
    }).then(function () {
      rebuildBarcodes();
      saveLocalStore();
      syncRunning = null;
      updateSyncLine();
      if (state.view === "barcodes") render();
      if (syncQueued) { syncQueued = false; scheduleSync(500); }
    });
    return syncRunning;
  }

  function attemptSync(tries) {
    return fetchShared().then(function (res) {
      if (res.data && res.data.barcodes) LOCAL.remoteCache = res.data.barcodes;
      var key = getSyncKey();
      var pendingKeys = Object.keys(LOCAL.pending);
      var needCreate = !res.data;
      if (!key) {
        return pendingKeys.length ? "Add a sync key on the Barcodes screen to share this phone's new matches." : null;
      }
      if (state.syncKeyBad) throw syncErr(401, "bad key");

      // Drop codes that fail the barcode check digit (bad reads from before
      // validation existed). Shop labels with letters are left alone.
      var badKeys = res.data ? Object.keys(res.data.barcodes).filter(function (k) {
        return /^\d+$/.test(k) && !cleanBarcode(k, "");
      }) : [];
      badKeys.forEach(function (k) { delete LOCAL.pending[k]; });
      pendingKeys = Object.keys(LOCAL.pending);
      if (!pendingKeys.length && !needCreate && !badKeys.length) return null;

      var sent = {};
      var base = {};
      if (needCreate) {
        Object.keys(BUILT_IN_BARCODES).forEach(function (k) {
          var b = BUILT_IN_BARCODES[k];
          base[k] = { product: b[0], packageDesc: b[1], addedBy: "starter", note: b[2] };
        });
      } else {
        Object.keys(res.data.barcodes).forEach(function (k) { if (badKeys.indexOf(k) < 0) base[k] = res.data.barcodes[k]; });
      }
      pendingKeys.forEach(function (k) { base[k] = LOCAL.pending[k]; sent[k] = LOCAL.pending[k]; });
      var body = { about: "Cadence 5102 barcode database. Barcode (14-digit) -> product and package exactly as on the PDI count sheet.",
                   updated: new Date().toISOString(), barcodes: sortedObj(base) };
      var first = pendingKeys.length ? LOCAL.pending[pendingKeys[0]] : null;
      var message = !pendingKeys.length && badKeys.length ? "Remove " + badKeys.length + " bad barcode read" + (badKeys.length === 1 ? "" : "s")
        : needCreate && !pendingKeys.length ? "Start barcode database"
        : pendingKeys.length === 1 ? "Add barcode " + pendingKeys[0] + " (" + first.product + ")"
        : "Add " + pendingKeys.length + " barcodes";
      var payload = { message: message, content: textToB64(JSON.stringify(body, null, 1)), branch: DB.branch };
      if (res.sha) payload.sha = res.sha;

      return (needCreate ? ensureBranch() : Promise.resolve()).then(function () {
        return gh("PUT", "/contents/" + DB.path, payload);
      }).then(function (r) {
        if ((r.status === 409 || r.status === 422) && tries < 3) return attemptSync(tries + 1); // someone else saved first
        if (!r.ok) throw syncErr(r.status, "write failed");
        LOCAL.remoteCache = body.barcodes;
        // Only clear what was actually sent; anything matched during the upload stays queued.
        Object.keys(sent).forEach(function (k) { if (LOCAL.pending[k] === sent[k]) delete LOCAL.pending[k]; });
        return null;
      });
    });
  }

  function syncLineText() {
    var total = Object.keys(LOCAL.barcodes).length;
    var waiting = Object.keys(LOCAL.pending).length;
    var t = total + (total === 1 ? " barcode" : " barcodes") + " in the shared database";
    if (state.syncStatus === "syncing") t += " · syncing…";
    else if (waiting) t += " · " + waiting + " waiting to sync";
    return t;
  }
  function updateSyncLine() {
    var n = document.getElementById("syncLine");
    if (n) n.textContent = syncLineText();
  }

  function loadSessions() {
    state.sessions = Object.keys(LOCAL.sessions).map(function (id) {
      return Object.assign({ id: id }, LOCAL.sessions[id]);
    }).sort(function (a, b) { return (b.createdAt || "").localeCompare(a.createdAt || ""); }).slice(0, 20);
    state.sessionsLoaded = true;
    if (state.view === "sessions" || state.view === "loading") {
      state.view = "sessions";
      render();
    }
  }

  function openSession(sessionId) {
    state.currentSessionId = sessionId;
    var sess = LOCAL.sessions[sessionId];
    state.currentSession = sess || null;
    state.counts = (sess && sess.counts) || {};
    state.view = "progress";
    render();
  }

  function saveCount(idx, item, qty, barcode) {
    var sess = LOCAL.sessions[state.currentSessionId];
    if (!sess) return Promise.resolve();
    if (!sess.counts) sess.counts = {};
    var body = {
      product: item.product,
      packageDesc: item.packageDesc,
      bin: item.bin || null,
      book: item.book,
      unbilled: item.unbilled || 0,
      countedQty: qty,
      countedAt: new Date().toISOString(),
    };
    if (barcode) body.barcode = barcode;
    sess.counts[idx] = body;
    state.counts = sess.counts;
    saveLocalStore();
    return Promise.resolve();
  }

  function learnBarcode(barcode, item) {
    LOCAL.pending[barcode] = {
      product: item.product,
      packageDesc: item.packageDesc,
      addedBy: "scan",
      addedAt: new Date().toISOString(),
    };
    rebuildBarcodes();
    saveLocalStore();
    scheduleSync();
    return Promise.resolve();
  }

  function parseCountSheetText(text) {
    var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(function (l) { return l.length; });
    if (!lines.length) return [];
    var delim = lines[0].indexOf("\t") >= 0 ? "\t" : ",";
    function splitLine(l) {
      if (delim !== ",") return l.split("\t");
      var out = [], cur = "", inQ = false;
      for (var i = 0; i < l.length; i++) {
        var c = l[i];
        if (inQ) {
          if (c === '"') { if (l[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
          else cur += c;
        } else if (c === '"') { inQ = true; }
        else if (c === ",") { out.push(cur); cur = ""; }
        else { cur += c; }
      }
      out.push(cur);
      return out;
    }
    var rows = lines.map(splitLine);
    var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    var hasHeader = header.indexOf("product") >= 0 || header.indexOf("book") >= 0 ||
      header.some(function (h) { return /product|book|package/.test(h); });
    var colIdx = { product: 0, packageDesc: 1, bin: 2, book: 3, unbilled: -1 };
    if (hasHeader) {
      colIdx = { product: -1, packageDesc: -1, bin: -1, book: -1, unbilled: -1 };
      header.forEach(function (h, i) {
        if (colIdx.product < 0 && /product|item|description/.test(h)) colIdx.product = i;
        else if (colIdx.packageDesc < 0 && /package|pkg|unit/.test(h)) colIdx.packageDesc = i;
        else if (colIdx.bin < 0 && /^bin$|location/.test(h)) colIdx.bin = i;
        else if (colIdx.book < 0 && /book|system|expected|qty/.test(h)) colIdx.book = i;
        else if (colIdx.unbilled < 0 && /unbilled/.test(h)) colIdx.unbilled = i;
      });
      rows = rows.slice(1);
    }
    var items = [];
    rows.forEach(function (r) {
      var product = (colIdx.product >= 0 ? r[colIdx.product] : "") || "";
      product = product.trim();
      if (!product) return;
      var book = parseFloat(colIdx.book >= 0 ? r[colIdx.book] : "");
      items.push({
        product: product,
        packageDesc: (colIdx.packageDesc >= 0 ? (r[colIdx.packageDesc] || "") : "").trim(),
        bin: (colIdx.bin >= 0 ? (r[colIdx.bin] || "") : "").trim(),
        book: isNaN(book) ? 0 : book,
        unbilled: colIdx.unbilled >= 0 ? (parseFloat(r[colIdx.unbilled]) || 0) : 0,
      });
    });
    return items;
  }

  function createSession(label, items) {
    var id = "s" + Date.now().toString(36);
    LOCAL.sessions[id] = {
      label: label,
      businessDate: new Date().toISOString().slice(0, 10),
      items: items,
      counts: {},
      createdAt: new Date().toISOString(),
    };
    saveLocalStore();
    return id;
  }

  function findItemIndexByProduct(items, product, packageDesc) {
    var np = (product || "").trim().toUpperCase();
    var nk = (packageDesc || "").trim().toUpperCase();
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if ((it.product || "").trim().toUpperCase() === np &&
          (!nk || (it.packageDesc || "").trim().toUpperCase() === nk)) {
        return i;
      }
    }
    return -1;
  }

  // ---------- scanning ----------
  // Live camera feed (getUserMedia) that reads barcodes continuously, using
  // the phone's built-in barcode detector when the browser has one.
  // "Take Photo" stays as a fallback for small or damaged labels.

  var SCAN_FORMATS_READY = typeof Html5QrcodeSupportedFormats !== "undefined" ? [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE
  ] : undefined;

  var SCANNER_CONFIG = {
    formatsToSupport: SCAN_FORMATS_READY,
    verbose: false,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  };

  var stopPromise = Promise.resolve();
  var pendingStart = Promise.resolve();

  // Stop the live camera if it's running. Safe to call any time.
  function stopLiveScan() {
    state.scanToken = null;
    var s = state.liveScanner;
    if (!s) return stopPromise;
    state.liveScanner = null;
    stopPromise = Promise.resolve()
      .then(function () { return s.stop(); })
      .then(function () { try { s.clear(); } catch (e) {} })
      .catch(function () {});
    return stopPromise;
  }

  function startLiveScan(readerId, statusEl) {
    if (typeof Html5Qrcode === "undefined") {
      statusEl.textContent = "The barcode reader didn't load. Check your signal and reload, or use Search.";
      return;
    }
    var token = {};
    // Wait for any earlier camera session to fully release before opening a new one.
    pendingStart.then(function () { return stopPromise; }).then(function () {
      if (state.view !== "scan" || !document.getElementById(readerId)) return;
      state.scanToken = token;
      var scanner = new Html5Qrcode(readerId, SCANNER_CONFIG);
      var fired = false;
      var candidate = null; // a code must be read the same way twice before it counts
      pendingStart = scanner.start(
        { facingMode: "environment" },
        {
          fps: 12,
          qrbox: function (w, h) {
            return { width: Math.floor(w * 0.9), height: Math.max(90, Math.floor(Math.min(w, h) * 0.5)) };
          }
        },
        function (decodedText, decodedResult) {
          if (fired) return;
          var fmt = "";
          try { fmt = decodedResult.result.format.formatName; } catch (e) {}
          var code = cleanBarcode(decodedText, fmt);
          if (!code) return; // bad or partial read; keep looking
          var now = Date.now();
          // Ignore the box you just counted while you move to the next one.
          if (state.lastSaved && code === state.lastSaved.code && now - state.lastSaved.at < 4000) return;
          if (!candidate || candidate.code !== code || now - candidate.at > 1500) {
            candidate = { code: code, at: now };
            return;
          }
          fired = true;
          if (navigator.vibrate) navigator.vibrate(80);
          stopLiveScan().then(function () { handleDecoded(code); });
        },
        function () { /* no barcode in this frame; keep looking */ }
      ).then(function () {
        if (state.scanToken !== token) {
          // User left the scan screen while the camera was starting.
          return scanner.stop().then(function () { try { scanner.clear(); } catch (e) {} }).catch(function () {});
        }
        state.liveScanner = scanner;
        statusEl.textContent = "Point at the barcode. It scans on its own.";
      }).catch(function (err) {
        var msg = String((err && err.message) || err || "");
        if (/permission|notallowed|denied/i.test(msg)) {
          statusEl.textContent = "Camera access is blocked. Tap the icon left of the address bar, allow Camera, then reload.";
        } else {
          statusEl.textContent = "Couldn't start the camera. Use Take Photo or Search instead.";
        }
      });
    });
  }

  function decodePhoto(file, onDecoded) {
    if (typeof Html5Qrcode === "undefined") {
      toast("Barcode reader failed to load. Use Search instead.");
      return;
    }
    state.decoding = true;
    state.scanError = null;
    render();
    var scanner = new Html5Qrcode("reader-file", SCANNER_CONFIG);
    scanner.scanFile(file, false).then(function (decodedText) {
      state.decoding = false;
      var code = cleanBarcode(decodedText, "");
      if (!code) {
        state.scanError = "Got a partial read from that photo. Try again a little closer, or use Search.";
        render();
        return;
      }
      if (navigator.vibrate) navigator.vibrate(60);
      onDecoded(code);
    }).catch(function (err) {
      state.decoding = false;
      state.scanError = "Couldn't read a barcode in that photo. Try getting closer, filling the frame with just the barcode, and making sure it's in focus — or use search instead.";
      render();
    });
  }

  function handleDecoded(code) {
    var items = (state.currentSession && state.currentSession.items) || [];
    var data = LOCAL.barcodes[code];
    if (data) {
      var idx = findItemIndexByProduct(items, data.product, data.packageDesc);
      if (idx >= 0) {
        state.pendingItem = { idx: idx, item: items[idx], barcode: code, isNew: false };
        state.view = "qty";
        render();
      } else {
        state.scanError = 'Scanned a known item — "' + data.product + '" — but it\'s not on this count sheet. Search to double-check, or scan again.';
        state.view = "scan";
        render();
      }
    } else {
      state.pendingBarcode = code;
      state.view = "manual";
      state.searchTerm = "";
      render();
    }
  }

  // ---------- views ----------

  function render() {
    stopLiveScan();
    var main = document.getElementById("main");
    main.innerHTML = "";
    if (state.view === "loading") return renderLoading(main);
    if (state.view === "sessions") return renderSessions(main);
    if (state.view === "import") return renderImport(main);
    if (state.view === "barcodes") return renderBarcodes(main);
    if (state.view === "scan") return renderScan(main);
    if (state.view === "manual") return renderManual(main);
    if (state.view === "qty") return renderQty(main);
    if (state.view === "progress") return renderProgress(main);
  }

  function renderLoading(main) {
    setTopbar("Cycle Count", null, "");
    main.appendChild(el('<div class="empty-state"><div class="spinner" style="border-top-color:var(--navy);border-color:rgba(1,60,76,.2)"></div><div style="margin-top:10px;">Connecting…</div></div>'));
  }

  function renderSessions(main) {
    setTopbar("Cycle Count", null, '<button class="topbar-link" id="barcodesBtn">Barcodes</button>');
    document.getElementById("barcodesBtn").addEventListener("click", function () {
      state.view = "barcodes";
      render();
    });
    if (!state.sessionsLoaded) {
      main.appendChild(el('<div class="empty-state">Loading count sessions…</div>'));
      return;
    }
    if (state.sessionsError) {
      main.appendChild(el('<div class="banner banner-bad">' + escapeHtml(state.sessionsError) + "</div>"));
    }
    var newBtn = el('<button class="btn btn-primary" style="margin-bottom:14px;">+ New Count Sheet</button>');
    newBtn.addEventListener("click", function () {
      state.view = "import";
      render();
    });
    main.appendChild(newBtn);
    if (!state.sessions.length) {
      main.appendChild(el(
        '<div class="empty-state"><div class="big">&#128230;</div>' +
        "<div><b>No count sheets yet.</b></div>" +
        '<div style="margin-top:6px;">Tap "New Count Sheet," ask Claude to prep today\'s PDI count sheet, and paste what it gives you in.</div></div>'
      ));
      return;
    }
    main.appendChild(el('<h2 class="section">Count Sheets</h2>'));
    state.sessions.forEach(function (s) {
      var counted = s.itemCount ? countCompletedFor(s) : null;
      var card = el(
        '<div class="session-card">' +
          '<div class="info">' +
            '<div class="label">' + escapeHtml(s.label || s.id) + "</div>" +
            '<div class="sub">' + escapeHtml(s.items ? s.items.length : (s.itemCount || 0)) + " items" +
              (s.businessDate ? " · biz date " + escapeHtml(s.businessDate) : "") + "</div>" +
          "</div>" +
          '<div class="chev">&#8250;</div>' +
        "</div>"
      );
      card.addEventListener("click", function () { openSession(s.id); });
      main.appendChild(card);
    });
  }
  function countCompletedFor() { return null; }

  function renderBarcodes(main) {
    setTopbar("Barcodes", function () { state.view = "sessions"; render(); }, "");
    var total = Object.keys(LOCAL.barcodes).length;
    var waiting = Object.keys(LOCAL.pending).length;
    var hasKey = !!getSyncKey();
    var last = LOCAL.lastSync ? new Date(LOCAL.lastSync).toLocaleString() : "never";

    var status = el(
      '<div class="card">' +
        '<div class="stat-row" style="margin-bottom:10px;">' +
          '<div class="stat"><div class="num">' + total + '</div><div class="lbl">In database</div></div>' +
          '<div class="stat"><div class="num" style="color:' + (waiting ? "var(--warn)" : "var(--ok)") + '">' + waiting + '</div><div class="lbl">Waiting to sync</div></div>' +
        "</div>" +
        '<div class="muted" style="font-size:12.5px;">Last synced: ' + escapeHtml(last) + "</div>" +
        (state.syncError ? '<div class="banner banner-warn" style="margin:10px 0 0;">' + escapeHtml(state.syncError) + "</div>" : "") +
      "</div>"
    );
    main.appendChild(status);
    var syncBtn = el('<button class="btn btn-primary">' + (state.syncStatus === "syncing" ? "Syncing…" : "Sync now") + "</button>");
    syncBtn.disabled = state.syncStatus === "syncing";
    syncBtn.addEventListener("click", function () { syncBarcodes(); render(); });
    main.appendChild(syncBtn);

    main.appendChild(el('<h2 class="section">Sync key</h2>'));
    if (hasKey) {
      var keyCard = el('<div class="card"><div style="font-weight:bold;margin-bottom:4px;">Saved on this phone</div>' +
        '<div class="muted" style="font-size:12.5px;margin-bottom:10px;">New matches from this phone go straight to the shared database.</div></div>');
      var rm = el('<button class="btn btn-ghost">Remove key from this phone</button>');
      rm.addEventListener("click", function () { setSyncKey(""); state.syncKeyBad = false; state.syncError = null; render(); });
      keyCard.appendChild(rm);
      main.appendChild(keyCard);
    } else {
      var form = el('<div class="card">' +
        '<div class="muted" style="font-size:12.5px;margin-bottom:8px;">Without a key this phone can read the database, but its new matches stay here. Paste the GitHub key made for cadence-scanner to share them.</div>' +
        '<input id="syncKeyInput" type="password" autocomplete="off" placeholder="Paste sync key" ' +
          'style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px;margin-bottom:10px;">' +
      "</div>");
      var save = el('<button class="btn btn-lime">Save key</button>');
      save.addEventListener("click", function () {
        var v = document.getElementById("syncKeyInput").value.trim();
        if (!v) { toast("Paste the key first."); return; }
        setSyncKey(v);
        state.syncKeyBad = false;
        state.syncError = null;
        syncBarcodes();
        render();
      });
      form.appendChild(save);
      main.appendChild(form);
    }

    main.appendChild(el('<h2 class="section">Add barcodes from a list</h2>'));
    var add = el('<div class="card">' +
      '<div class="muted" style="font-size:12.5px;margin-bottom:8px;">One per line: barcode, product, package. Product and package must match the count sheet. Claude can prep these.</div>' +
      '<textarea id="bulkCodes" rows="5" placeholder="00074130955066,VAL ADV FULL SYN 5W30 6/32,Case Gallons" ' +
        'style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:monospace;font-size:12.5px;"></textarea>' +
    "</div>");
    var addBtn = el('<button class="btn btn-outline" style="margin-top:10px;">Add to database</button>');
    addBtn.addEventListener("click", function () {
      var lines = document.getElementById("bulkCodes").value.split(/\r?\n/);
      var added = 0, skipped = 0;
      lines.forEach(function (line) {
        if (!line.trim()) return;
        var parts = line.split(/\t|,/).map(function (s) { return s.trim(); });
        // A real barcode is one unbroken run of digits (or letters/digits for shop labels).
        var code = /^[A-Za-z0-9\-.]{4,}$/.test(parts[0]) && /\d/.test(parts[0]) ? cleanBarcode(parts[0], "") : null;
        if (!code || !parts[1]) { skipped++; return; }
        LOCAL.pending[code] = { product: parts[1], packageDesc: parts[2] || "", addedBy: "list", addedAt: new Date().toISOString() };
        added++;
      });
      rebuildBarcodes();
      saveLocalStore();
      toast("Added " + added + (skipped ? " · skipped " + skipped + " bad line" + (skipped === 1 ? "" : "s") : ""));
      syncBarcodes();
      render();
    });
    add.appendChild(addBtn);
    main.appendChild(add);
  }

  function renderImport(main) {
    setTopbar("New Count Sheet", function () { state.view = "sessions"; render(); }, "");
    var card = el(
      '<div class="card">' +
        '<div style="font-weight:bold;margin-bottom:8px;">Sheet name</div>' +
        '<input id="impLabel" type="text" placeholder="e.g. AM Pre-Pick — Sep 29" ' +
          'style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px;margin-bottom:14px;">' +
        '<div style="font-weight:bold;margin-bottom:8px;">Paste count sheet</div>' +
        '<div class="muted" style="font-size:12.5px;margin-bottom:8px;">' +
          "Ask Claude to prep today&#39;s PDI count sheet as Product, Package, Bin, Book columns, then paste it here." +
        "</div>" +
        '<textarea id="impData" rows="10" placeholder="Product, Package, Bin, Book" ' +
          'style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:monospace;font-size:13px;"></textarea>' +
      "</div>"
    );
    main.appendChild(card);
    var errBox = el('<div class="banner banner-bad" style="display:none;margin-bottom:12px;"></div>');
    main.appendChild(errBox);
    var btn = el('<button class="btn btn-primary">Create Count Sheet</button>');
    btn.addEventListener("click", function () {
      var label = document.getElementById("impLabel").value.trim() || ("Count Sheet " + new Date().toLocaleDateString());
      var text = document.getElementById("impData").value;
      var items = parseCountSheetText(text);
      if (!items.length) {
        errBox.textContent = "Couldn't find any rows. Each line needs at least a product name and a book quantity.";
        errBox.style.display = "block";
        return;
      }
      var id = createSession(label, items);
      loadSessions();
      openSession(id);
    });
    main.appendChild(btn);
  }

  function progressStats() {
    var items = (state.currentSession && state.currentSession.items) || [];
    var counted = 0, ok = 0, warn = 0, bad = 0;
    items.forEach(function (it, idx) {
      var c = state.counts[idx];
      if (c && c.countedQty != null) {
        counted++;
        var diff = Math.abs((c.countedQty || 0) - (it.book || 0));
        if (diff < 0.01) ok++; else if (diff <= 1) warn++; else bad++;
      }
    });
    return { total: items.length, counted: counted, ok: ok, warn: warn, bad: bad };
  }

  function renderProgress(main) {
    var sess = state.currentSession;
    var label = sess ? (sess.label || state.currentSessionId) : "…";
    setTopbar(label, function () {
      state.currentSessionId = null;
      state.view = "sessions";
      render();
    }, sess ? '<span class="progress-pill">' + progressStats().counted + " / " + progressStats().total + "</span>" : "");

    if (!sess) {
      main.appendChild(el('<div class="empty-state">Loading session…</div>'));
      return;
    }

    var stats = progressStats();

    var actions = el('<div class="btn-row" style="margin-bottom:14px;"></div>');
    var scanBtn = el('<button class="btn btn-lime">&#128247; Scan Barcode</button>');
    scanBtn.addEventListener("click", function () {
      state.scanError = null;
      state.view = "scan";
      render();
    });
    var searchBtn = el('<button class="btn btn-outline">&#128269; Search</button>');
    searchBtn.addEventListener("click", function () {
      state.pendingBarcode = null;
      state.searchTerm = "";
      state.view = "manual";
      render();
    });
    actions.appendChild(scanBtn);
    actions.appendChild(searchBtn);
    main.appendChild(actions);

    var statRow = el(
      '<div class="stat-row">' +
        '<div class="stat"><div class="num">' + stats.counted + "/" + stats.total + '</div><div class="lbl">Counted</div></div>' +
        '<div class="stat"><div class="num" style="color:var(--ok)">' + stats.ok + '</div><div class="lbl">Match</div></div>' +
        '<div class="stat"><div class="num" style="color:var(--warn)">' + stats.warn + '</div><div class="lbl">Off &le;1</div></div>' +
        '<div class="stat"><div class="num" style="color:var(--bad)">' + stats.bad + '</div><div class="lbl">Off &gt;1</div></div>' +
      "</div>"
    );
    main.appendChild(statRow);

    var exportBtn = el('<button class="btn btn-ghost" style="margin:10px 0 4px;">&#8595; Export counts (.csv)</button>');
    exportBtn.addEventListener("click", exportCsv);
    main.appendChild(exportBtn);
    main.appendChild(el('<div id="syncLine" class="muted" style="text-align:center;font-size:12px;margin-bottom:6px;">' +
      escapeHtml(syncLineText()) + "</div>"));

    main.appendChild(el('<h2 class="section">Items</h2>'));
    var list = el('<div class="card" style="padding:4px 12px;"></div>');
    sess.items.forEach(function (it, idx) {
      var c = state.counts[idx];
      var flagClass = "flag-pending", countText = '<span class="book">not counted</span>';
      if (c && c.countedQty != null) {
        var diff = Math.abs((c.countedQty || 0) - (it.book || 0));
        flagClass = diff < 0.01 ? "flag-ok" : (diff <= 1 ? "flag-warn" : "flag-bad");
        countText = fmtNum(c.countedQty) + ' <span class="book">/ ' + fmtNum(it.book) + "</span>";
      } else {
        countText = '<span class="book">book ' + fmtNum(it.book) + "</span>";
      }
      var row = el(
        '<div class="prog-row">' +
          '<span class="flag ' + flagClass + '"></span>' +
          '<span class="name">' + escapeHtml(it.product) +
            '<span class="sub">' + escapeHtml(it.packageDesc) + (it.bin ? " · bin " + escapeHtml(it.bin) : "") + "</span></span>" +
          '<span class="counts">' + countText + "</span>" +
        "</div>"
      );
      row.addEventListener("click", function () {
        state.pendingItem = { idx: idx, item: it, barcode: (c && c.barcode) || null, isNew: false };
        state.view = "qty";
        render();
      });
      list.appendChild(row);
    });
    main.appendChild(list);
  }

  function renderScan(main) {
    setTopbar("Scan", function () { state.view = "progress"; render(); }, "");
    if (state.scanError) {
      main.appendChild(el('<div class="banner banner-warn">' + escapeHtml(state.scanError) + "</div>"));
    }

    main.appendChild(el('<div id="reader-file"></div>'));

    if (state.decoding) {
      main.appendChild(el('<div class="scan-frame-hint"><span class="spinner" style="border-top-color:var(--navy);border-color:rgba(1,60,76,.2)"></span> Reading barcode…</div>'));
    } else {
      main.appendChild(el('<div id="reader-live"></div>'));
      var status = el('<div class="scan-frame-hint">Starting camera…</div>');
      main.appendChild(status);
      startLiveScan("reader-live", status);
    }

    main.appendChild(el('<div class="scan-frame-hint" style="margin-top:4px;">New barcodes get matched once, then the app remembers them.</div>'));

    var fileInput = el('<input type="file" accept="image/*" capture="environment" style="display:none">');
    main.appendChild(fileInput);
    fileInput.addEventListener("change", function () {
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if (!file) return;
      decodePhoto(file, handleDecoded);
    });

    var fallbackRow = el('<div class="btn-row" style="margin-top:16px;"></div>');
    var captureBtn = el('<button class="btn btn-outline">&#128247; Take Photo</button>');
    captureBtn.addEventListener("click", function () { stopLiveScan(); fileInput.click(); });
    fallbackRow.appendChild(captureBtn);
    main.appendChild(fallbackRow);

    var searchBtn = el('<button class="btn btn-outline">&#128269; Search</button>');
    searchBtn.addEventListener("click", function () {
      state.searchTerm = "";
      state.pendingBarcode = null;
      state.view = "manual";
      render();
    });
    fallbackRow.appendChild(searchBtn);
  }

  function renderManual(main) {
    var sess = state.currentSession;
    var items = (sess && sess.items) || [];
    var isNewBarcode = !!state.pendingBarcode;
    setTopbar(isNewBarcode ? "New Barcode" : "Search", function () {
      state.pendingBarcode = null;
      state.view = "progress";
      render();
    }, "");

    if (isNewBarcode) {
      main.appendChild(el(
        '<div class="banner banner-ok">Barcode <b>' + escapeHtml(prettyBarcode(state.pendingBarcode)) + '</b> isn\'t matched yet. Tap the item it belongs to and the app will remember it from now on.</div>'
      ));
    }

    var box = el('<input class="search-box" type="text" placeholder="Search item name…" autocomplete="off" autocapitalize="off">');
    box.value = state.searchTerm;
    box.addEventListener("input", function () {
      state.searchTerm = box.value;
      renderManualResults();
    });
    main.appendChild(box);
    var results = el('<div id="manualResults"></div>');
    main.appendChild(results);

    function renderManualResults() {
      var list = document.getElementById("manualResults");
      if (!list) return;
      list.innerHTML = "";
      var term = state.searchTerm.trim().toUpperCase();
      var filtered = items.map(function (it, idx) { return { it: it, idx: idx }; })
        .filter(function (o) { return !term || o.it.product.toUpperCase().indexOf(term) >= 0; })
        .slice(0, 60);
      if (!filtered.length) {
        list.appendChild(el('<div class="empty-state">No items match "' + escapeHtml(state.searchTerm) + '".</div>'));
        return;
      }
      filtered.forEach(function (o) {
        var c = state.counts[o.idx];
        var row = el(
          '<div class="item-row">' +
            '<div><div class="name">' + escapeHtml(o.it.product) + '</div>' +
            '<div class="meta">' + escapeHtml(o.it.packageDesc) + (o.it.bin ? " · bin " + escapeHtml(o.it.bin) : "") + "</div></div>" +
            '<div class="book-badge">book ' + fmtNum(o.it.book) + (c && c.countedQty != null ? "<br>counted " + fmtNum(c.countedQty) : "") + "</div>" +
          "</div>"
        );
        row.addEventListener("click", function () {
          // Remember the barcode right away, even if the count gets cancelled.
          if (state.pendingBarcode) learnBarcode(state.pendingBarcode, o.it);
          state.pendingItem = { idx: o.idx, item: o.it, barcode: state.pendingBarcode || null, isNew: !!state.pendingBarcode };
          state.view = "qty";
          render();
        });
        list.appendChild(row);
      });
    }
    renderManualResults();
    setTimeout(function () { box.focus(); }, 60);
  }

  function renderQty(main) {
    var p = state.pendingItem;
    if (!p) { state.view = "progress"; render(); return; }
    var it = p.item;
    var existing = state.counts[p.idx];
    setTopbar("Enter Count", function () {
      state.pendingBarcode = null;
      state.view = p.fromScan ? "scan" : "progress";
      render();
    }, "");

    var startVal = existing && existing.countedQty != null ? existing.countedQty : (it.book || 0);
    var card = el(
      '<div class="card qty-card">' +
        '<div class="pname">' + escapeHtml(it.product) + "</div>" +
        '<div class="pmeta">' + escapeHtml(it.packageDesc) + (it.bin ? " · bin " + escapeHtml(it.bin) : "") + "</div>" +
        '<div class="qty-stepper">' +
          '<button id="qtyMinus" type="button">&#8722;</button>' +
          '<input id="qtyInput" type="text" inputmode="decimal" value="' + fmtNum(startVal) + '">' +
          '<button id="qtyPlus" type="button">&#43;</button>' +
        "</div>" +
        '<div class="book-ref">Book qty: <b>' + fmtNum(it.book) + "</b></div>" +
      "</div>"
    );
    main.appendChild(card);

    var input = card.querySelector("#qtyInput");
    card.querySelector("#qtyMinus").addEventListener("click", function () {
      input.value = fmtNum(Math.max(0, (parseFloat(input.value) || 0) - 1));
    });
    card.querySelector("#qtyPlus").addEventListener("click", function () {
      input.value = fmtNum((parseFloat(input.value) || 0) + 1);
    });

    if (p.barcode) {
      main.appendChild(el('<div class="banner banner-ok" style="margin-top:-2px;">' +
        (p.isNew ? "Barcode " + escapeHtml(prettyBarcode(p.barcode)) + " saved to this item."
                 : "Matched by barcode " + escapeHtml(prettyBarcode(p.barcode)) + ".") + "</div>"));
    }

    var saveBtn = el('<button class="btn btn-primary" style="margin-top:8px;">Save Count</button>');
    saveBtn.addEventListener("click", function () {
      var qty = parseFloat(input.value);
      if (isNaN(qty) || qty < 0) { toast("Enter a valid quantity."); return; }
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span class="spinner"></span>';
      var work = saveCount(p.idx, it, qty, p.barcode);
      if (p.isNew && p.barcode) {
        work = work.then(function () { return learnBarcode(p.barcode, it); });
      }
      work.then(function () {
        toast("Saved: " + it.product + " = " + fmtNum(qty));
        var cameFromScan = !!p.barcode;
        if (cameFromScan) state.lastSaved = { code: p.barcode, at: Date.now() };
        state.pendingItem = null;
        state.pendingBarcode = null;
        state.scanError = null;
        state.view = cameFromScan ? "scan" : "progress";
        render();
      }).catch(function (e) {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Count";
        toast("Save failed: " + (e.code || e.message || "unknown error"));
      });
    });
    main.appendChild(saveBtn);

    if (p.barcode) {
      var rematch = el('<button class="btn btn-ghost" style="margin-top:6px;">Wrong item? Match this barcode to a different one</button>');
      rematch.addEventListener("click", function () {
        state.pendingBarcode = p.barcode;
        state.pendingItem = null;
        state.searchTerm = "";
        state.view = "manual";
        render();
      });
      main.appendChild(rematch);
    }

    var scanAnother = null;
    if (state.currentSession) {
      scanAnother = el('<button class="btn btn-ghost" style="margin-top:6px;">Cancel</button>');
      scanAnother.addEventListener("click", function () {
        state.pendingItem = null;
        state.pendingBarcode = null;
        state.view = "progress";
        render();
      });
      main.appendChild(scanAnother);
    }
  }

  function exportCsv() {
    var sess = state.currentSession;
    if (!sess) return;
    var rows = [["Product", "Package", "Bin", "Book", "Counted", "Variance", "Counted At"]];
    sess.items.forEach(function (it, idx) {
      var c = state.counts[idx];
      var counted = c && c.countedQty != null ? c.countedQty : "";
      var variance = c && c.countedQty != null ? fmtNum((c.countedQty || 0) - (it.book || 0)) : "";
      rows.push([it.product, it.packageDesc, it.bin || "", fmtNum(it.book), counted === "" ? "" : fmtNum(counted), variance, (c && c.countedAt) || ""]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (v) {
        v = String(v == null ? "" : v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(",");
    }).join("\n");

    try {
      var blob = new Blob([csv], { type: "text/csv" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "Cadence Cycle Count - " + (sess.label || state.currentSessionId) + ".csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast("Exported.");
    } catch (e) {
      toast("Export failed.");
    }
  }

  // ---------- boot ----------

  function boot() {
    state.view = "sessions";
    loadSessions();
    syncBarcodes();
    document.addEventListener("visibilitychange", function () {
      // Pick up other phones' matches when coming back to the app (at most every 2 min).
      if (document.visibilityState === "visible" && (Object.keys(LOCAL.pending).length || Date.now() - lastPullAt > 120000)) {
        syncBarcodes();
      }
    });
  }

  boot();
})();
</script>
</body>
